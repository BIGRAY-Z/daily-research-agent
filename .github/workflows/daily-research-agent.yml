name: Daily Research Agent

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate reports without sending email"
        required: false
        default: "false"
      skip_llm:
        description: "Collect only, no LLM calls"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    env:
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STAGE1_MODEL: ${{ vars.STAGE1_MODEL }}
      STAGE2_MODEL: ${{ vars.STAGE2_MODEL }}
      REPORT_MODEL: ${{ vars.REPORT_MODEL }}
      REPORT_FALLBACK_MODEL: ${{ vars.REPORT_FALLBACK_MODEL }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
      SMTP_STARTTLS: ${{ vars.SMTP_STARTTLS }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_TO: ${{ vars.EMAIL_TO }}
      LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS || '3' }}
      MAX_REPORTS: ${{ vars.MAX_REPORTS || '8' }}
      STAGE1_CONFIDENCE_THRESHOLD: ${{ vars.STAGE1_CONFIDENCE_THRESHOLD || '7' }}
      LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || '90' }}
      REPORT_TIMEOUT_SECONDS: ${{ vars.REPORT_TIMEOUT_SECONDS || '420' }}
      REPORT_MAX_CHARS: ${{ vars.REPORT_MAX_CHARS || '90000' }}
      REPORT_FALLBACK_MAX_CHARS: ${{ vars.REPORT_FALLBACK_MAX_CHARS || '25000' }}
      REPORT_MAX_RETRIES: ${{ vars.REPORT_MAX_RETRIES || '1' }}
      REPORT_CONSECUTIVE_FAILURE_LIMIT: ${{ vars.REPORT_CONSECUTIVE_FAILURE_LIMIT || '2' }}
      REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || 'zh' }}
      SEND_EMAIL: ${{ vars.SEND_EMAIL || 'true' }}
      SKIP_SOURCES: ${{ vars.SKIP_SOURCES || 'false' }}
      ANTHROPIC_URLS: ${{ vars.ANTHROPIC_URLS || 'https://www.anthropic.com/research' }}
      TRANSFORMER_CIRCUITS_URLS: ${{ vars.TRANSFORMER_CIRCUITS_URLS || 'https://transformer-circuits.pub/' }}
      ALIGNMENT_FORUM_URLS: ${{ vars.ALIGNMENT_FORUM_URLS || 'https://www.alignmentforum.org/' }}
      WORKFLOW_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      WORKFLOW_SKIP_LLM: ${{ github.event.inputs.skip_llm || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Check required runtime configuration
        run: |
          missing=0
          for name in OPENAI_BASE_URL OPENAI_API_KEY STAGE1_MODEL STAGE2_MODEL REPORT_MODEL REPORT_MAX_RETRIES REPORT_CONSECUTIVE_FAILURE_LIMIT SMTP_HOST SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM EMAIL_TO; do
            if [ -n "${!name}" ]; then
              echo "$name=SET"
            else
              echo "$name=MISSING"
              missing=1
            fi
          done
          exit "$missing"

      - name: Run research agent
        run: |
          ARGS=""
          if [ "$WORKFLOW_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$WORKFLOW_SKIP_LLM" = "true" ]; then ARGS="$ARGS --skip-llm"; fi
          python -m research_agent run $ARGS

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-agent-reports
          path: |
            reports/**
            data/state.json
          if-no-files-found: ignore

      - name: Commit state and reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily research agent state"
            git push
          fi
