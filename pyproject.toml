[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-research-agent"
version = "0.1.0"
description = "Daily AI safety research agent for arXiv, Hugging Face, Alignment Forum, and Anthropic sources."
readme = "README_AGENT.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "markdown>=3.5",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
